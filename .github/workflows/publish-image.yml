name: Publish container image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ !github.event.deleted }}
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    with:
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      context: .
      file: apps/board/Dockerfile
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository }}
      meta-flavor: latest=false
      meta-tags: |
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        type=ref,event=tag
      set-meta-labels: true
      sign: 'false'
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
