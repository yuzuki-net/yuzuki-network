[workspace]
resolver = "3"
members = ["apps/board", "apps/client", "apps/node", "crates/core-config", "crates/protocol"]
default-members = ["apps/board"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
yuzuki-protocol = { path = "crates/protocol" }
yuzuki-core-config = { path = "crates/core-config" }
