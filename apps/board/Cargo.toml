[package]
name = "board"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap.workspace = true

mime_guess = "2"
rand = "0.9"
rust-embed = { version = "8", features = ["debug-embed", "interpolate-folder-path"] }
sea-orm = { version = "1.1", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-json", "with-uuid"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
sha2 = "0.10"
tokio = { workspace = true, features = ["fs", "net", "signal", "sync"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["compression-gzip"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
yuzuki-protocol.workspace = true
yuzuki-core-config.workspace = true
serde_yaml_ng = "0.10"
async-trait = "0.1"

hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
time = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
